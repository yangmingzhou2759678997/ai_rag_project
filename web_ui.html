<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI RAG 智能助手</title>
    <!-- 引入Markdown渲染库，CDN加载，不用安装 -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: #f5f7fa;
            height: 100vh;
            display: flex;
        }

        /* ========== 侧边栏 ========== */
        .sidebar {
            width: 280px;
            background-color: #f0f2f5;
            border-right: 1px solid #e4e7ed;
            padding: 20px 15px;
            display: flex;
            flex-direction: column;
        }

        .app-title {
            font-size: 22px;
            font-weight: 600;
            color: #1f2937;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .user-info {
            background-color: #dcfce7;
            padding: 10px 12px;
            border-radius: 6px;
            margin-bottom: 15px;
            font-size: 14px;
            color: #166534;
        }

        .btn {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 6px;
            font-size: 15px;
            font-weight: 500;
            cursor: pointer;
            transition: background-color 0.2s;
            margin-bottom: 10px;
        }

        .btn-primary {
            background-color: #ef4444;
            color: white;
        }

        .btn-primary:hover {
            background-color: #dc2626;
        }

        .btn-secondary {
            background-color: white;
            border: 1px solid #d1d5db;
            color: #374151;
        }

        .btn-secondary:hover {
            background-color: #f9fafb;
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .section-title {
            font-size: 14px;
            color: #6b7280;
            margin: 15px 0 10px;
            font-weight: 500;
        }

        .session-list {
            flex: 1;
            overflow-y: auto;
            margin-bottom: 15px;
        }

        .session-item {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 10px 12px;
            border-radius: 6px;
            cursor: pointer;
            margin-bottom: 6px;
            background-color: white;
            border: 1px solid #e5e7eb;
        }

        .session-item.active {
            background-color: #eff6ff;
            border-color: #3b82f6;
        }

        .session-name {
            flex: 1;
            font-size: 14px;
            color: #374151;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .session-btn {
            width: 24px;
            height: 24px;
            border: none;
            background: none;
            cursor: pointer;
            font-size: 14px;
            opacity: 0.7;
        }

        .session-btn:hover {
            opacity: 1;
        }

        .logout-btn {
            margin-top: auto;
        }

        /* ========== 知识库管理区域 ========== */
        .knowledge-panel {
            padding-top: 12px;
            border-top: 1px solid #d1d5db;
        }

        .knowledge-panel .section-title {
            margin-top: 0;
        }

        .knowledge-file-input {
            width: 100%;
            margin-bottom: 10px;
            font-size: 13px;
            color: #374151;
        }

        .knowledge-list {
            max-height: 180px;
            overflow-y: auto;
            margin-bottom: 10px;
        }

        .knowledge-item {
            padding: 9px 10px;
            margin-bottom: 6px;
            background-color: white;
            border: 1px solid #e5e7eb;
            border-radius: 6px;
        }

        .knowledge-file-name {
            margin-bottom: 5px;
            font-size: 13px;
            color: #374151;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .knowledge-file-info {
            display: flex;
            align-items: center;
            justify-content: space-between;
            color: #9ca3af;
            font-size: 12px;
        }

        .knowledge-delete-btn {
            border: none;
            background: none;
            color: #dc2626;
            cursor: pointer;
            font-size: 12px;
        }

        .knowledge-delete-btn:hover {
            color: #b91c1c;
        }

        .knowledge-tip {
            min-height: 18px;
            margin-bottom: 8px;
            font-size: 12px;
        }

        /* ========== 登录注册面板 ========== */
        .auth-panel {
            display: none;
        }

        .auth-tabs {
            display: flex;
            margin-bottom: 20px;
            border-bottom: 1px solid #e5e7eb;
        }

        .auth-tab {
            flex: 1;
            padding: 10px;
            text-align: center;
            cursor: pointer;
            font-size: 14px;
            border-bottom: 2px solid transparent;
        }

        .auth-tab.active {
            border-bottom-color: #3b82f6;
            color: #3b82f6;
            font-weight: 500;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            font-size: 14px;
            color: #374151;
            margin-bottom: 6px;
        }

        .form-group input {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            font-size: 14px;
            outline: none;
        }

        .form-group input:focus {
            border-color: #3b82f6;
        }

        .error-tip {
            color: #dc2626;
            font-size: 13px;
            margin-top: 8px;
        }

        .success-tip {
            color: #16a34a;
            font-size: 13px;
            margin-top: 8px;
        }

        /* ========== 主聊天区 ========== */
        .chat-main {
            flex: 1;
            display: flex;
            flex-direction: column;
            background-color: white;
        }

        .chat-header {
            padding: 20px 40px;
            border-bottom: 1px solid #e5e7eb;
        }

        .chat-header h2 {
            font-size: 24px;
            color: #1f2937;
        }

        .chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 30px 40px;
        }

        .welcome-tip {
            text-align: center;
            margin-top: 150px;
            color: #6b7280;
        }

        .welcome-tip h1 {
            font-size: 32px;
            margin-bottom: 12px;
            color: #1f2937;
        }

        /* ========== 消息样式 ========== */
        .message-item {
            display: flex;
            margin-bottom: 24px;
            max-width: 85%;
        }

        .message-item.user {
            flex-direction: row-reverse;
            margin-left: auto;
        }

        .message-avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background-color: #f3f4f6;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            flex-shrink: 0;
        }

        .message-item.user .message-avatar {
            margin-left: 12px;
        }

        .message-item.assistant .message-avatar {
            margin-right: 12px;
        }

        .message-content {
            padding: 12px 16px;
            border-radius: 10px;
            line-height: 1.6;
            font-size: 15px;
            word-break: break-word;
        }

        .message-item.user .message-content {
            background-color: #f3f4f6;
            color: #1f2937;
        }

        .message-item.assistant .message-content {
            background-color: #f9fafb;
            color: #1f2937;
            border: 1px solid #e5e7eb;
        }

        /* 流式打字光标 */
        .cursor {
            display: inline-block;
            animation: blink 1s infinite;
            margin-left: 2px;
            font-weight: normal;
        }

        @keyframes blink {
            0%, 50% { opacity: 1; }
            51%, 100% { opacity: 0; }
        }

        /* Markdown内容样式 */
        .markdown-content p {
            margin-bottom: 10px;
        }

        .markdown-content p:last-child {
            margin-bottom: 0;
        }

        .markdown-content ul, .markdown-content ol {
            margin: 10px 0;
            padding-left: 24px;
        }

        .markdown-content li {
            margin-bottom: 6px;
        }

        .markdown-content code {
            background-color: #f3f4f6;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 14px;
        }

        .markdown-content pre {
            background-color: #1f2937;
            color: #f9fafb;
            padding: 12px;
            border-radius: 6px;
            overflow-x: auto;
            margin: 10px 0;
        }

        .markdown-content pre code {
            background: none;
            color: inherit;
            padding: 0;
        }

        /* ========== 输入区 ========== */
        .input-area {
            display: flex;
            padding: 20px 40px;
            border-top: 1px solid #e5e7eb;
            gap: 12px;
            background-color: #fafafa;
        }

        .chat-input {
            flex: 1;
            padding: 12px 16px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 15px;
            outline: none;
            transition: border-color 0.2s;
        }

        .chat-input:focus {
            border-color: #3b82f6;
        }

        .chat-input:disabled {
            background-color: #f3f4f6;
            cursor: not-allowed;
        }

        .send-btn {
            padding: 12px 24px;
            background-color: #3b82f6;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 15px;
            font-weight: 500;
            transition: background-color 0.2s;
        }

        .send-btn:hover:not(:disabled) {
            background-color: #2563eb;
        }

        .send-btn:disabled {
            background-color: #93c5fd;
            cursor: not-allowed;
        }

        /* 页脚 */
        .footer {
            text-align: center;
            padding: 10px;
            color: #9ca3af;
            font-size: 12px;
            border-top: 1px solid #e5e7eb;
        }
    </style>
</head>
<body>
    <!-- 侧边栏 -->
    <div class="sidebar">
        <div class="app-title">🤖 AI RAG 智能助手</div>

        <!-- 登录注册面板 -->
        <div id="authPanel" class="auth-panel">
            <div class="auth-tabs">
                <div class="auth-tab active" data-tab="login">登录</div>
                <div class="auth-tab" data-tab="register">注册</div>
            </div>

            <div id="loginForm">
                <div class="form-group">
                    <label>用户名</label>
                    <input type="text" id="loginUsername" placeholder="请输入用户名">
                </div>
                <div class="form-group">
                    <label>密码</label>
                    <input type="password" id="loginPassword" placeholder="请输入密码">
                </div>
                <div id="loginError" class="error-tip" style="display: none;"></div>
                <button class="btn btn-primary" onclick="handleLogin()">登录</button>
            </div>

            <div id="registerForm" style="display: none;">
                <div class="form-group">
                    <label>用户名</label>
                    <input type="text" id="regUsername" placeholder="请设置用户名">
                </div>
                <div class="form-group">
                    <label>密码</label>
                    <input type="password" id="regPassword" placeholder="请设置密码（至少6位）">
                </div>
                <div class="form-group">
                    <label>确认密码</label>
                    <input type="password" id="regConfirm" placeholder="请再次输入密码">
                </div>
                <div id="regTip" style="display: none;"></div>
                <button class="btn btn-secondary" onclick="handleRegister()">注册</button>
            </div>
        </div>

        <!-- 已登录面板 -->
        <div id="loggedPanel" style="display: none;">
            <div class="user-info">已登录：<span id="usernameText"></span></div>
            <button class="btn btn-primary" onclick="createNewSession()">➕ 新建会话</button>

            <div class="section-title">历史会话</div>
            <button class="btn btn-secondary" onclick="loadSessionList()">🔄 刷新</button>

            <div id="sessionList" class="session-list"></div>

            <!-- 知识库管理区域 -->
            <div class="knowledge-panel">
                <div class="section-title">知识库管理</div>

                <input
                    type="file"
                    id="knowledgeFileInput"
                    class="knowledge-file-input"
                    accept=".txt,.md,.pdf,.docx,.xlsx"
                >

                <button id="uploadKnowledgeBtn" class="btn btn-secondary" onclick="uploadKnowledgeFile()">
                    📤 上传知识文件
                </button>

                <button class="btn btn-secondary" onclick="loadKnowledgeDocuments()">
                    🔄 刷新文件列表
                </button>

                <div id="knowledgeTip" class="knowledge-tip"></div>
                <div id="knowledgeList" class="knowledge-list"></div>
            </div>

            <button class="btn btn-secondary logout-btn" onclick="handleLogout()">🚪 退出登录</button>
        </div>
    </div>

    <!-- 主聊天区 -->
    <div class="chat-main">
        <div class="chat-header">
            <h2 id="currentSessionTitle">💬 当前会话: 新会话</h2>
        </div>

        <div id="chatContainer" class="chat-container">
            <div class="welcome-tip">
                <h1>AI 智能助手</h1>
                <p>请输入你的问题，我会基于内部知识库为你解答</p>
            </div>
        </div>

        <div class="input-area">
            <input
                type="text"
                id="chatInput"
                class="chat-input"
                placeholder="输入你的问题..."
                onkeydown="handleInputKeydown(event)"
            >
            <button id="sendBtn" class="send-btn" onclick="handleSend()">发送 ➤</button>
        </div>

        <div class="footer">
            © 2026 AI RAG 智能助手 | 基于 FastAPI + PGVector + Agentic RAG 架构
        </div>
    </div>

    <script>
        // ========== 全局配置 ==========
        const BACKEND_BASE_URL = "http://localhost:8000";
        let state = {
            token: localStorage.getItem("token") || null,
            username: localStorage.getItem("username") || null,
            currentSessionId: null,
            messages: [],
            isStreaming: false,
            abortController: null
        };

        // ========== 初始化 ==========
        window.onload = function() {
            // 登录注册tab切换
            document.querySelectorAll(".auth-tab").forEach(tab => {
                tab.onclick = function() {
                    document.querySelectorAll(".auth-tab").forEach(t => t.classList.remove("active"));
                    this.classList.add("active");
                    const tabName = this.dataset.tab;
                    document.getElementById("loginForm").style.display = tabName === "login" ? "block" : "none";
                    document.getElementById("registerForm").style.display = tabName === "register" ? "block" : "none";
                };
            });

            // 检查登录状态
            if (state.token) {
                showLoggedPanel();
                loadSessionList();
                loadKnowledgeDocuments();
            } else {
                showAuthPanel();
            }
        };

        // ========== 面板切换 ==========
        function showAuthPanel() {
            document.getElementById("authPanel").style.display = "block";
            document.getElementById("loggedPanel").style.display = "none";
        }

        function showLoggedPanel() {
            document.getElementById("authPanel").style.display = "none";
            document.getElementById("loggedPanel").style.display = "block";
            document.getElementById("usernameText").textContent = state.username;
        }

        // ========== 登录注册 ==========
        async function handleLogin() {
            const username = document.getElementById("loginUsername").value.trim();
            const password = document.getElementById("loginPassword").value;
            const errorEl = document.getElementById("loginError");

            if (!username || !password) {
                errorEl.textContent = "用户名和密码不能为空";
                errorEl.style.display = "block";
                return;
            }

            try {
                const formData = new FormData();
                formData.append("username", username);
                formData.append("password", password);

                const res = await fetch(`${BACKEND_BASE_URL}/api/auth/login`, {
                    method: "POST",
                    body: formData
                });

                const data = await res.json();
                if (!res.ok) {
                    throw new Error(data.detail || "登录失败");
                }

                state.token = data.access_token;
                state.username = username;
                localStorage.setItem("token", state.token);
                localStorage.setItem("username", state.username);

                errorEl.style.display = "none";
                showLoggedPanel();
                loadSessionList();
                loadKnowledgeDocuments();
            } catch (e) {
                errorEl.textContent = e.message;
                errorEl.style.display = "block";
            }
        }

        async function handleRegister() {
            const username = document.getElementById("regUsername").value.trim();
            const password = document.getElementById("regPassword").value;
            const confirm = document.getElementById("regConfirm").value;
            const tipEl = document.getElementById("regTip");

            if (!username || !password) {
                tipEl.textContent = "用户名和密码不能为空";
                tipEl.className = "error-tip";
                tipEl.style.display = "block";
                return;
            }
            if (password !== confirm) {
                tipEl.textContent = "两次输入的密码不一致";
                tipEl.className = "error-tip";
                tipEl.style.display = "block";
                return;
            }
            if (password.length < 6) {
                tipEl.textContent = "密码长度至少6位";
                tipEl.className = "error-tip";
                tipEl.style.display = "block";
                return;
            }

            try {
                const res = await fetch(`${BACKEND_BASE_URL}/api/auth/register`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ username, password })
                });

                if (!res.ok) {
                    const data = await res.json();
                    throw new Error(data.detail || "注册失败");
                }

                tipEl.textContent = "注册成功！请切换到登录页登录";
                tipEl.className = "success-tip";
                tipEl.style.display = "block";
            } catch (e) {
                tipEl.textContent = e.message;
                tipEl.className = "error-tip";
                tipEl.style.display = "block";
            }
        }

        function handleLogout() {
            state.token = null;
            state.username = null;
            state.currentSessionId = null;
            state.messages = [];
            localStorage.removeItem("token");
            localStorage.removeItem("username");

            document.getElementById("knowledgeFileInput").value = "";
            document.getElementById("knowledgeList").innerHTML = "";
            document.getElementById("knowledgeTip").textContent = "";

            showAuthPanel();
            renderChatArea();
        }

        // ========== 知识库管理 ==========
        async function loadKnowledgeDocuments() {
            if (!state.token) return;

            const listEl = document.getElementById("knowledgeList");
            const tipEl = document.getElementById("knowledgeTip");

            listEl.innerHTML = "<div style='text-align:center;color:#9ca3af;font-size:12px;'>加载中...</div>";

            try {
                const res = await fetch(`${BACKEND_BASE_URL}/api/knowledge/documents`, {
                    headers: { "Authorization": `Bearer ${state.token}` }
                });

                const data = await res.json();

                if (!res.ok) {
                    throw new Error(data.detail || "获取知识库文件列表失败");
                }

                const fileList = data.data || [];

                if (fileList.length === 0) {
                    listEl.innerHTML = "<div style='text-align:center;color:#9ca3af;font-size:12px;'>暂无知识库文件</div>";
                    return;
                }

                listEl.innerHTML = "";

                fileList.forEach(fileInfo => {
                    const item = document.createElement("div");
                    item.className = "knowledge-item";

                    const fileNameEl = document.createElement("div");
                    fileNameEl.className = "knowledge-file-name";
                    fileNameEl.title = fileInfo.file_name;
                    fileNameEl.textContent = fileInfo.file_name;

                    const fileInfoEl = document.createElement("div");
                    fileInfoEl.className = "knowledge-file-info";

                    const detailEl = document.createElement("span");
                    detailEl.textContent = `${fileInfo.file_type.toUpperCase()} · ${fileInfo.chunk_count}个片段`;

                    const deleteBtn = document.createElement("button");
                    deleteBtn.className = "knowledge-delete-btn";
                    deleteBtn.textContent = "删除";
                    deleteBtn.onclick = () => deleteKnowledgeDocument(fileInfo.file_name);

                    fileInfoEl.appendChild(detailEl);
                    fileInfoEl.appendChild(deleteBtn);
                    item.appendChild(fileNameEl);
                    item.appendChild(fileInfoEl);
                    listEl.appendChild(item);
                });

                tipEl.textContent = "";
            } catch (e) {
                listEl.innerHTML = "";
                tipEl.textContent = e.message;
                tipEl.className = "knowledge-tip error-tip";
            }
        }

        async function uploadKnowledgeFile() {
            const fileInput = document.getElementById("knowledgeFileInput");
            const uploadBtn = document.getElementById("uploadKnowledgeBtn");
            const tipEl = document.getElementById("knowledgeTip");

            if (!state.token) {
                tipEl.textContent = "请先登录";
                tipEl.className = "knowledge-tip error-tip";
                return;
            }

            if (fileInput.files.length === 0) {
                tipEl.textContent = "请先选择需要上传的文件";
                tipEl.className = "knowledge-tip error-tip";
                return;
            }

            const selectedFile = fileInput.files[0];
            const formData = new FormData();
            formData.append("file", selectedFile);

            uploadBtn.disabled = true;
            uploadBtn.textContent = "上传处理中...";
            tipEl.textContent = "正在提取文本、切分并生成向量，请稍候";
            tipEl.className = "knowledge-tip";

            try {
                const res = await fetch(`${BACKEND_BASE_URL}/api/knowledge/upload`, {
                    method: "POST",
                    headers: { "Authorization": `Bearer ${state.token}` },
                    body: formData
                });

                const data = await res.json();

                if (!res.ok) {
                    throw new Error(data.detail || "文件上传失败");
                }

                const chunkCount = data.data ? data.data.chunk_count : 0;
                tipEl.textContent = `上传成功，共生成${chunkCount}个知识片段`;
                tipEl.className = "knowledge-tip success-tip";
                fileInput.value = "";

                await loadKnowledgeDocuments();
            } catch (e) {
                tipEl.textContent = e.message;
                tipEl.className = "knowledge-tip error-tip";
            } finally {
                uploadBtn.disabled = false;
                uploadBtn.textContent = "📤 上传知识文件";
            }
        }

        async function deleteKnowledgeDocument(fileName) {
            if (!confirm(`确定要删除知识文件“${fileName}”吗？`)) return;

            const tipEl = document.getElementById("knowledgeTip");

            try {
                const encodedFileName = encodeURIComponent(fileName);
                const res = await fetch(`${BACKEND_BASE_URL}/api/knowledge/documents/${encodedFileName}`, {
                    method: "DELETE",
                    headers: { "Authorization": `Bearer ${state.token}` }
                });

                const data = await res.json();

                if (!res.ok) {
                    throw new Error(data.detail || "文件删除失败");
                }

                tipEl.textContent = `已删除知识文件：${fileName}`;
                tipEl.className = "knowledge-tip success-tip";

                await loadKnowledgeDocuments();
            } catch (e) {
                tipEl.textContent = e.message;
                tipEl.className = "knowledge-tip error-tip";
            }
        }

        // ========== 会话管理 ==========
        async function loadSessionList() {
            if (!state.token) return;
            
            const listEl = document.getElementById("sessionList");
            listEl.innerHTML = "<div style='text-align:center;color:#9ca3af;font-size:13px;'>加载中...</div>";

            try {
                const res = await fetch(`${BACKEND_BASE_URL}/api/chat/sessions`, {
                    headers: { "Authorization": `Bearer ${state.token}` }
                });

                if (!res.ok) throw new Error("获取会话列表失败");
                const data = await res.json();
                const sessions = data.data || [];

                if (sessions.length === 0) {
                    listEl.innerHTML = "<div style='text-align:center;color:#9ca3af;font-size:13px;'>暂无历史会话</div>";
                    // 自动创建一个新会话
                    if (!state.currentSessionId) {
                        createNewSession(false);
                    }
                    return;
                }

                listEl.innerHTML = "";
                sessions.forEach(sessionId => {
                    const sessionName = getSessionName(sessionId);
                    const item = document.createElement("div");
                    item.className = `session-item ${sessionId === state.currentSessionId ? "active" : ""}`;
                    item.innerHTML = `
                        <span class="session-name" title="${sessionName}">${sessionName}</span>
                        <button class="session-btn" title="删除" onclick="deleteSession(event, '${sessionId}')">🗑️</button>
                    `;
                    item.querySelector(".session-name").onclick = () => switchSession(sessionId);
                    listEl.appendChild(item);
                });

                // 如果没有当前会话，默认选中第一个
                if (!state.currentSessionId && sessions.length > 0) {
                    switchSession(sessions[0]);
                }
            } catch (e) {
                listEl.innerHTML = `<div style="text-align:center;color:#dc2626;font-size:13px;">${e.message}</div>`;
            }
        }

        function getSessionName(sessionId) {
            const cached = localStorage.getItem(`session_name_${sessionId}`);
            return cached || "新会话";
        }

        function saveSessionName(sessionId, name) {
            if (name.trim()) {
                localStorage.setItem(`session_name_${sessionId}`, name.trim());
            }
        }

        function createNewSession(refresh = true) {
            const newId = crypto.randomUUID();
            state.currentSessionId = newId;
            state.messages = [];
            saveSessionName(newId, "新会话");
            renderChatArea();
            updateSessionTitle();
            if (refresh) {
                loadSessionList();
            }
        }

        async function switchSession(sessionId) {
            if (state.isStreaming) return;
            if (sessionId === state.currentSessionId) return;

            state.currentSessionId = sessionId;
            state.messages = [];
            
            try {
                const res = await fetch(`${BACKEND_BASE_URL}/api/chat/history/${sessionId}`, {
                    headers: { "Authorization": `Bearer ${state.token}` }
                });

                if (res.ok) {
                    const data = await res.json();
                    state.messages = data.data || [];
                    
                    // 自动生成会话名称
                    if (state.messages.length > 0) {
                        const firstUserMsg = state.messages.find(m => m.role === "user");
                        if (firstUserMsg) {
                            const name = firstUserMsg.content.length > 12 
                                ? firstUserMsg.content.slice(0, 12) + "..." 
                                : firstUserMsg.content;
                            saveSessionName(sessionId, name);
                        }
                    }
                }
            } catch (e) {
                console.error("加载历史消息失败", e);
            }

            renderChatArea();
            updateSessionTitle();
            loadSessionList();
        }

        async function deleteSession(event, sessionId) {
            event.stopPropagation();
            if (state.isStreaming) return;
            if (!confirm("确定要删除这个会话吗？")) return;

            try {
                const res = await fetch(`${BACKEND_BASE_URL}/api/chat/sessions/${sessionId}`, {
                    method: "DELETE",
                    headers: { "Authorization": `Bearer ${state.token}` }
                });

                if (!res.ok) throw new Error("删除失败");

                localStorage.removeItem(`session_name_${sessionId}`);
                
                // 如果删除的是当前会话，新建一个
                if (sessionId === state.currentSessionId) {
                    state.currentSessionId = null;
                    state.messages = [];
                }

                loadSessionList();
                renderChatArea();
            } catch (e) {
                alert(e.message);
            }
        }

        function updateSessionTitle() {
            const name = getSessionName(state.currentSessionId);
            document.getElementById("currentSessionTitle").textContent = `💬 当前会话: ${name}`;
        }

        // ========== 聊天渲染 ==========
        function renderChatArea() {
            const container = document.getElementById("chatContainer");
            
            if (!state.token || state.messages.length === 0) {
                container.innerHTML = `
                    <div class="welcome-tip">
                        <h1>AI 智能助手</h1>
                        <p>请输入你的问题，我会基于内部知识库为你解答</p>
                    </div>
                `;
                return;
            }

            container.innerHTML = "";
            state.messages.forEach(msg => {
                appendMessage(msg.role, msg.content, false);
            });

            // 滚动到底部
            container.scrollTop = container.scrollHeight;
        }

        function appendMessage(role, content, isStreaming = false) {
            const container = document.getElementById("chatContainer");
            
            // 如果是新消息，创建消息节点
            const msgEl = document.createElement("div");
            msgEl.className = `message-item ${role}`;
            
            const avatar = document.createElement("div");
            avatar.className = "message-avatar";
            avatar.textContent = role === "user" ? "👤" : "🤖";
            
            const contentWrapper = document.createElement("div");
            contentWrapper.className = "message-content";
            
            if (isStreaming) {
                contentWrapper.innerHTML = `${content}<span class="cursor">▌</span>`;
            } else {
                contentWrapper.className += " markdown-content";
                contentWrapper.innerHTML = marked.parse(content);
            }

            msgEl.appendChild(avatar);
            msgEl.appendChild(contentWrapper);
            container.appendChild(msgEl);

            // 滚动到底部
            container.scrollTop = container.scrollHeight;

            return contentWrapper;
        }

        function updateStreamingMessage(contentEl, content) {
            contentEl.innerHTML = `${content}<span class="cursor">▌</span>`;
            // 自动滚动
            const container = document.getElementById("chatContainer");
            container.scrollTop = container.scrollHeight;
        }

        function finishStreamingMessage(contentEl, content) {
            contentEl.className = "message-content markdown-content";
            contentEl.innerHTML = marked.parse(content);
            // 滚动到底部
            const container = document.getElementById("chatContainer");
            container.scrollTop = container.scrollHeight;
        }

        // ========== 发送消息 + 流式处理 ==========
        function handleInputKeydown(event) {
            if (event.key === "Enter" && !event.shiftKey) {
                event.preventDefault();
                handleSend();
            }
        }

        async function handleSend() {
            const input = document.getElementById("chatInput");
            const sendBtn = document.getElementById("sendBtn");
            const query = input.value.trim();

            if (!query || state.isStreaming) return;
            if (!state.currentSessionId) {
                createNewSession(false);
            }

            // 清空输入框，禁用按钮
            input.value = "";
            input.disabled = true;
            sendBtn.disabled = true;
            state.isStreaming = true;

            // 添加用户消息
            state.messages.push({ role: "user", content: query });
            appendMessage("user", query);

            // 如果是新会话第一条消息，更新会话名称
            const userMsgs = state.messages.filter(m => m.role === "user");
            if (userMsgs.length === 1) {
                const name = query.length > 12 ? query.slice(0, 12) + "..." : query;
                saveSessionName(state.currentSessionId, name);
                updateSessionTitle();
                loadSessionList();
            }

            // 创建AI消息占位
            const aiContentEl = appendMessage("assistant", "", true);
            let fullContent = "";

            // 创建中止控制器
            state.abortController = new AbortController();

            try {
                const res = await fetch(`${BACKEND_BASE_URL}/api/chat/completions`, {
                    method: "POST",
                    headers: {
                        "Authorization": `Bearer ${state.token}`,
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        query: query,
                        session_id: state.currentSessionId,
                        temperature: 0.1
                    }),
                    signal: state.abortController.signal
                });

                if (!res.ok) {
                    const errText = await res.text();
                    throw new Error(`请求失败 (${res.status}): ${errText}`);
                }

                // 处理流式响应
                const reader = res.body.getReader();
                const decoder = new TextDecoder("utf-8");
                let buffer = "";

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;

                    buffer += decoder.decode(value, { stream: true });
                    
                    // 按行解析SSE
                    const lines = buffer.split("\n");
                    buffer = lines.pop(); // 保留不完整的行

                    for (const line of lines) {
                        if (!line.startsWith("data: ")) continue;
                        const dataStr = line.slice(6).trim();
                        
                        if (dataStr === "[DONE]") {
                            // 流结束
                            break;
                        }

                        try {
                            const data = JSON.parse(dataStr);
                            if (data.content) {
                                fullContent += data.content;
                                updateStreamingMessage(aiContentEl, fullContent);
                            }
                        } catch (e) {
                            // 解析失败跳过
                            continue;
                        }
                    }
                }

                // 流结束，最终渲染Markdown
                finishStreamingMessage(aiContentEl, fullContent);
                state.messages.push({ role: "assistant", content: fullContent });

            } catch (e) {
                if (e.name === "AbortError") {
                    fullContent += "\n\n[已中止生成]";
                } else {
                    fullContent = `❌ 出错了：${e.message}`;
                }
                finishStreamingMessage(aiContentEl, fullContent);
                state.messages.push({ role: "assistant", content: fullContent });
            } finally {
                // 恢复状态
                state.isStreaming = false;
                state.abortController = null;
                input.disabled = false;
                sendBtn.disabled = false;
                input.focus();
            }
        }
    </script>
</body>
</html>
